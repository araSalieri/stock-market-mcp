[project]
name = "stock-market-mcp"
version = "0.1.0"
description = "Read-only stock market MCP server for coding agents"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2",
    "pandas>=2.3.3",
    "pandas-ta>=0.4.71b0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "yfinance>=0.2.60",
]

[project.scripts]
stock-market-mcp = "stock_market_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pyright>=1.1.400",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::pandas.errors.Pandas4Warning:pandas_ta"]
